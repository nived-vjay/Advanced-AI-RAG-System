services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER= #enter username
      - POSTGRES_PASSWORD= #enter password
      - POSTGRES_DB= #enter database name
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
