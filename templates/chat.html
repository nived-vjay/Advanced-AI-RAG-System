<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AI Assistant</title>
    <!-- Use Google Fonts: Playfair Display and Inter -->
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        :root {
            --bg-color: #F5F5DC;
            /* Beige */
            --header-color: #3E2723;
            /* Dark Brown */
            --user-msg-color: #5D4037;
            /* Medium Brown */
            --ai-msg-color: #FDFBF7;
            /* Off-white / Cream */
            --accent-color: #795548;
            --text-dark: #2C1810;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F5F5DC 0%, #E7D7C1 100%);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 900px;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100%;
            border-left: 1px solid #dcd0c0;
            border-right: 1px solid #dcd0c0;
        }

        @media (min-width: 768px) {
            .chat-container {
                margin: 20px;
                border-radius: 16px;
                height: calc(100% - 40px);
                box-shadow: 0 15px 40px rgba(62, 39, 35, 0.1);
                border: none;
                overflow: hidden;
            }
        }

        .chat-header {
            padding: 20px 30px;
            background-color: var(--header-color);
            color: #F5F5DC;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header .logo-container {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .chat-header .status {
            font-size: 0.8rem;
            background: rgba(245, 245, 220, 0.15);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
            border: 1px solid rgba(245, 245, 220, 0.2);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            background-color: #FDFBF7;
        }

        .message {
            max-width: 80%;
            padding: 16px 20px;
            border-radius: 18px;
            line-height: 1.6;
            font-size: 0.98rem;
            position: relative;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-msg-color);
            color: #F5F5DC;
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background-color: #ffffff;
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
            border: 1px solid #E7D7C1;
        }

        .input-area {
            padding: 25px 30px;
            background: #ffffff;
            display: flex;
            gap: 15px;
            align-items: center;
            border-top: 1px solid #E7D7C1;
        }

        textarea {
            flex: 1;
            background: #F9F7F1;
            border: 1px solid #E7D7C1;
            border-radius: 12px;
            padding: 15px;
            color: var(--text-dark);
            resize: none;
            height: 50px;
            font-family: inherit;
            transition: all 0.2s;
        }

        textarea:focus {
            outline: none;
            background: #ffffff;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(121, 85, 72, 0.1);
        }

        button {
            background: linear-gradient(135deg, #3E2723 0%, #5D4037 100%);
            color: #F5F5DC;
            border: none;
            border-radius: 12px;
            padding: 0 30px;
            height: 54px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #D7CCC8;
            color: #8D6E63;
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="logo-container">
                Nexus AI
            </div>
            <div class="status">Assistant Active</div>
        </div>
        <div class="chat-history" id="chat-history">
            <div class="message ai">
                Hello! I am **Nexus AI**, your personal Knowledge Assistant. I can help you navigate and understand the
                information within your documents. How can I assist you today?
            </div>
        </div>
        <div class="input-area">
            <textarea id="user-input" placeholder="Type your message here..."></textarea>
            <button id="send-btn">Send</button>
        </div>
    </div>


    <script>
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerText = text;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return div; // Return for updating if needed
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add user message
            appendMessage('user', text);
            userInput.value = '';

            // UI state
            userInput.disabled = true;
            sendBtn.disabled = true;

            const aiMessageDiv = appendMessage('ai', '...');
            aiMessageDiv.innerText = ''; // Clear loading text

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                if (!response.body) throw new Error('ReadableStream not supported.');

                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    aiMessageDiv.innerText += chunk;
                    chatHistory.scrollTop = chatHistory.scrollHeight;
                }
            } catch (error) {
                console.error('Error:', error);
                aiMessageDiv.innerText += "\n[Error connecting to AI]";
            } finally {
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
    </script>
</body>

</html>
